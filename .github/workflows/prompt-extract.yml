name: Prompt extract (AI 选题)

on:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: '素材源（内置名或 rss:URL）'
        required: false
        default: 'arxiv-math'
      limit:
        description: '构造题目数上限'
        required: false
        default: '5'

env:
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run AI extract
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pnpm --filter @healthy-life/prompt-extract extract \
            --source "${{ inputs.source || 'arxiv-math' }}" \
            --limit "${{ inputs.limit || '5' }}" \
            --out content/prompts/drafts

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- content/prompts/drafts; then
            echo "没有新的 draft 题目，跳过"
          else
            branch="prompt-drafts-$(date +%Y%m%d%H%M)"
            git checkout -b "$branch"
            git add content/prompts/drafts
            git commit -m "chore(prompts): AI 选题 draft（$(date +%Y-%m-%d)）" || true
            git push origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "题库草案：$(date +%Y-%m-%d) 提取" \
              --body "AI 从公开源提取的题目草案（status: draft）。人工审核要点：答案准确性、来源可溯、风格符合「现象入口+证否直觉+深度答案」。审核通过后把 status 改为 published 并合并，再手动触发 prompt-release 发布。"
          fi
