name: Prompt bundle release (发布题目包)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect published bundles
        id: collect
        run: |
          mkdir -p dist/prompt-bundles
          count=0
          for f in content/prompts/published/*.json; do
            [ -e "$f" ] || continue
            cp "$f" "dist/prompt-bundles/$(basename "$f")"
            count=$((count + 1))
          done
          echo "bundles=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "没有已发布的题目包（content/prompts/published/*.json 为空）"
            exit 1
          fi
          ls -la dist/prompt-bundles

      - name: Validate bundles
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "dist/prompt-bundles";
            for (const f of fs.readdirSync(dir)) {
              const b = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              const ok = b.schemaVersion === 1 && Array.isArray(b.prompts) && b.prompts.length > 0
                && b.status === "published" && b.version && b.categories?.length;
              if (!ok) { console.error("校验失败:", f); process.exit(1); }
              for (const p of b.prompts) {
                if (!p.id || !p.question || !p.answer || !p.source) {
                  console.error("题目缺字段:", f, p.id); process.exit(1);
                }
              }
              console.log("OK:", f, "v" + b.version, b.prompts.length + "题");
            }
          '

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prompts-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" dist/prompt-bundles/*.json \
            --title "题目包 $(date +%Y-%m-%d)" \
            --notes "已审核发布的题目包。在服务端配置 PROMPT_BUNDLE_URL 指向对应 bundle.json（或 admin 后台手动导入）：\nhttps://github.com/${{ github.repository }}/releases/download/$tag/<bundle文件名>.json"
          echo "发布完成：$tag"
