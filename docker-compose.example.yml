# 部署用示例：从 GHCR 拉取镜像运行（无需本地构建）。
#
# 用法：
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env          # 改 BASE_URL / NTFY_BASE_URL / NTFY_TOKEN 等
#   docker compose pull
#   docker compose up -d
#
# 镜像由 GitHub Actions 自动构建并推送到 ghcr.io（见 .github/workflows/docker-publish.yml）。
services:
  server:
    image: ghcr.io/traveler0014/healthy-life:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # cron 与「天」的判定依赖容器时区，务必与 .env 的 TIMEZONE 一致
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # SQLite 单文件（WAL），持久化到宿主机
      - ./data:/app/data
    ports:
      - "${PORT:-8787}:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  jobs:
    image: ghcr.io/traveler0014/healthy-life:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
    # 等 server 先完成 migrate() + 管理员引导，避免两个进程并发跑首次迁移
    depends_on:
      server:
        condition: service_healthy
